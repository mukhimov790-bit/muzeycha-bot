
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Музейча — Виртуальный музей</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f0e7;color:#292b25}
header{background:#173f35;color:white;padding:24px 16px;text-align:center}
header h1{margin:0 0 10px;font-size:30px}
header p{margin:0;color:#e1e9dc}
nav{display:flex;justify-content:center;gap:8px;margin-top:18px}
button,.upload{border:0;border-radius:9px;padding:11px 15px;cursor:pointer;font-size:15px}
nav button{background:#fff;color:#173f35}
nav button.active{background:#d8b66a}
main{max-width:1100px;margin:auto;padding:20px 14px}
.welcome{background:#fff;border-radius:14px;padding:20px;margin-bottom:20px}
.welcome h2{margin-top:0}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
input[type=search]{flex:1;min-width:180px;padding:13px;border:1px solid #ccc;border-radius:9px;font-size:16px}
.upload{background:#173f35;color:white;display:inline-block}
input[type=file]{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}
.card{background:white;border-radius:13px;overflow:hidden;box-shadow:0 3px 12px #00000012}
.card img{width:100%;height:190px;object-fit:cover;display:block;background:#ddd}
.info{padding:15px}
.info h3{margin:0 0 9px}
.info p{line-height:1.5;color:#555}
.tag{font-size:12px;background:#e7eadf;padding:5px 8px;border-radius:20px}
.delete{background:#f5dddd;color:#852b2b;margin-top:8px}
footer{text-align:center;padding:25px;color:#666}
#status{margin:12px 0;color:#173f35}
</style>
</head>
<body>
<header>
<h1>🏛️ Музейча</h1>
<p id="subtitle">Открой для себя историю и культуру</p>
<nav>
<button id="ru" class="active" onclick="setLang('ru')">Русский</button>
<button id="kk" onclick="setLang('kk')">Қазақша</button>
</nav>
</header>

<main>
<section class="welcome">
<h2 id="welcomeTitle">Добро пожаловать в наш музей!</h2>
<p id="welcomeText">Изучайте интересные экспонаты, исторические предметы и культурное наследие.</p>
</section>

<div class="tools">
<input id="search" type="search" placeholder="Поиск экспонатов..." oninput="render()">
<label class="upload" for="photoInput" id="uploadLabel">📷 Добавить фото</label>
<input id="photoInput" type="file" accept="image/*" multiple>
</div>
<p id="status"></p>
<div id="gallery" class="grid"></div>
</main>
<footer id="footer">Музейча · Виртуальный музей</footer>

<script>
const translations = {
ru: {
subtitle:"Открой для себя историю и культуру",
welcomeTitle:"Добро пожаловать в наш музей!",
welcomeText:"Изучайте интересные экспонаты, исторические предметы и культурное наследие.",
search:"Поиск экспонатов...", upload:"📷 Добавить фото",
empty:"Экспонаты не найдены. Попробуйте другой поиск или добавьте фото.",
added:"Фото добавлено на этом устройстве.",
footer:"Музейча · Виртуальный музей",
items:[
["Древняя керамика","Керамические сосуды рассказывают о быте и мастерстве древних людей.","Археология"],
["История Великой степи","Культура и традиции народов Великой степи передавались из поколения в поколение.","История"],
["Национальные украшения","Украшения отражают традиции, мастерство и художественный вкус народа.","Культура"],
["Старинные монеты","Монеты помогают изучать торговлю и историю разных эпох.","Нумизматика"],
["Наследие кочевников","Предметы быта кочевников показывают их образ жизни и изобретательность.","Этнография"],
["Древние артефакты","Артефакты помогают учёным узнавать больше о жизни людей в прошлом.","Археология"]
]},
kk: {
subtitle:"Тарих пен мәдениетті таны",
welcomeTitle:"Музейімізге қош келдіңіз!",
welcomeText:"Қызықты жәдігерлерді, тарихи бұйымдар мен мәдени мұраны зерттеңіз.",
search:"Жәдігерлерді іздеу...", upload:"📷 Сурет қосу",
empty:"Жәдігер табылмады. Басқа сөзбен іздеңіз немесе сурет қосыңыз.",
added:"Сурет осы құрылғыға қосылды.",
footer:"Музейча · Виртуалды музей",
items:[
["Ежелгі қыш ыдыстар","Қыш ыдыстар ежелгі адамдардың тұрмысы мен шеберлігін танытады.","Археология"],
["Ұлы дала тарихы","Ұлы дала халықтарының мәдениеті мен дәстүрлері ұрпақтан ұрпаққа жалғасқан.","Тарих"],
["Ұлттық әшекейлер","Әшекейлер халықтың дәстүрі мен көркемдік талғамын көрсетеді.","Мәдениет"],
["Ескі тиындар","Тиындар арқылы сауда мен әр дәуірдің тарихын зерттеуге болады.","Нумизматика"],
["Көшпенділер мұрасы","Көшпенділердің тұрмыстық бұйымдары олардың өмір салтын көрсетеді.","Этнография"],
["Ежелгі жәдігерлер","Жәдігерлер өткен замандағы адамдардың өмірін тануға көмектеседі.","Археология"]
]}
};

const pictures = [
"https://images.unsplash.com/photo-1577083552431-6e5fd01aa342?auto=format&fit=crop&w=800&q=80",
"https://images.unsplash.com/photo-1461360228754-6e81c478b882?auto=format&fit=crop&w=800&q=80",
"https://images.unsplash.com/photo-1531058020387-3be344556be6?auto=format&fit=crop&w=800&q=80",
"https://images.unsplash.com/photo-1610375461246-83df859d849d?auto=format&fit=crop&w=800&q=80",
"https://images.unsplash.com/photo-1519682337058-a94d519337bc?auto=format&fit=crop&w=800&q=80",
"https://images.unsplash.com/photo-1561214115-f2f134cc4912?auto=format&fit=crop&w=800&q=80"
];

let lang = "ru";
let customItems = [];
try { customItems = JSON.parse(localStorage.getItem("muzeychaPhotos") || "[]"); }
catch(e) { customItems = []; }

function setLang(language) {
  lang = language;
  document.documentElement.lang = language;
  document.getElementById("ru").classList.toggle("active", language === "ru");
  document.getElementById("kk").classList.toggle("active", language === "kk");
  const t = translations[lang];
  document.getElementById("subtitle").textContent = t.subtitle;
  document.getElementById("welcomeTitle").textContent = t.welcomeTitle;
  document.getElementById("welcomeText").textContent = t.welcomeText;
  document.getElementById("search").placeholder = t.search;
  document.getElementById("uploadLabel").textContent = t.upload;
  document.getElementById("footer").textContent = t.footer;
  render();
}

function render() {
  const t = translations[lang];
  const term = document.getElementById("search").value.toLowerCase();
  const gallery = document.getElementById("gallery");
  gallery.innerHTML = "";
  let count = 0;

  t.items.forEach((item, i) => {
    if (!(item.join(" ").toLowerCase().includes(term))) return;
    const card = document.createElement("article");
    card.className = "card";
    const img = document.createElement("img");
    img.src = pictures[i];
    img.alt = item[0];
    img.loading = "lazy";
    img.onerror = () => { img.style.display = "none"; };
    const info = document.createElement("div");
    info.className = "info";
    info.innerHTML = "<span class='tag'></span><h3></h3><p></p>";
    info.querySelector(".tag").textContent = item[2];
    info.querySelector("h3").textContent = item[0];
    info.querySelector("p").textContent = item[1];
    card.append(img, info);
    gallery.append(card);
    count++;
  });

  customItems.forEach((item, i) => {
    if (!(item.name + " " + item.desc).toLowerCase().includes(term)) return;
    const card = document.createElement("article");
    card.className = "card";
    const img = document.createElement("img");
    img.src = item.src;
    img.alt = item.name;
    const info = document.createElement("div");
    info.className = "info";
    const h = document.createElement("h3");
    h.textContent = item.name;
    const p = document.createElement("p");
    p.textContent = item.desc || "";
    const del = document.createElement("button");
    del.className = "delete";
    del.textContent = lang === "ru" ? "Удалить" : "Жою";
    del.onclick = () => {
      customItems.splice(i, 1);
      try { localStorage.setItem("muzeychaPhotos", JSON.stringify(customItems)); }
      catch(e) {}
      render();
    };
    info.append(h, p, del);
    card.append(img, info);
    gallery.append(card);
    count++;
  });

  if (count === 0) {
    const msg = document.createElement("p");
    msg.textContent = t.empty;
    gallery.append(msg);
  }
}

document.getElementById("photoInput").addEventListener("change", async function(e) {
  const files = Array.from(e.target.files || []);
  const status = document.getElementById("status");
  let added = 0;

  for (const file of files) {
    if (!file.type.startsWith("image/")) continue;
    if (file.size > 2 * 1024 * 1024) {
      status.textContent = lang === "ru"
        ? "Файл больше 2 МБ. Выберите фото поменьше."
        : "Файл 2 МБ-тан үлкен. Кішірек сурет таңдаңыз.";
      continue;
    }
    const reader = new FileReader();
    const data = await new Promise(resolve => {
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => resolve(null);
      reader.readAsDataURL(file);
    });
    if (!data) continue;
    customItems.push({
      name: file.name.replace(/\.[^/.]+$/, ""),
      desc: lang === "ru" ? "Добавленный экспонат" : "Қосылған жәдігер",
      src: data
    });
    added++;
  }

  try {
    localStorage.setItem("muzeychaPhotos", JSON.stringify(customItems));
    status.textContent = added ? translations[lang].added : status.textContent;
  } catch(err) {
    status.textContent = lang === "ru"
      ? "Не хватило места для сохранения фото. Попробуйте добавить одно небольшое фото."
      : "Суретті сақтауға орын жетпеді. Бір кішірек суретті қосып көріңіз.";
  }
  render();
  e.target.value = "";
});

setLang("ru");
</script>
</body>
</html>
