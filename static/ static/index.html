
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Muzeycha</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      color: #202b3c;
    }

    header {
      background: #2457d6;
      color: white;
      padding: 22px 16px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      margin-bottom: 0;
    }

    main {
      max-width: 650px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 16px;
      box-shadow: 0 4px 18px #0000000d;
      margin-bottom: 18px;
    }

    h2 {
      margin-top: 0;
    }

    input[type="file"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #d6dce8;
      border-radius: 10px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border: 0;
      border-radius: 10px;
      background: #2457d6;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:active {
      opacity: 0.8;
    }

    #preview {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 15px;
    }

    #preview img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid #e2e6ef;
    }

    #message {
      color: #2457d6;
      overflow-wrap: anywhere;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #667085;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <header>
    <h1>🏛️ Muzeycha</h1>
    <p>O‘z rasmlaringni bir joyda ko‘r</p>
  </header>

  <main>
    <section class="card">
      <h2>📸 Rasmlarni tanlash</h2>
      <p>Telefoningdan rasm tanla va ko‘r.</p>

      <input
        type="file"
        id="photos"
        accept="image/*"
        multiple
      >

      <div id="preview"></div>
      <p id="message"></p>
    </section>

    <section class="card">
      <h2>ℹ️ Muzeycha haqida</h2>
      <p>
        Bu Muzeycha saytining boshlang‘ich sahifasi.
        Rasmlarni tanlab, shu sahifada ko‘rishing mumkin.
      </p>
    </section>
  </main>

  <footer>
    © Muzeycha
  </footer>

  <script>
    const photos = document.getElementById("photos");
    const preview = document.getElementById("preview");
    const message = document.getElementById("message");

    photos.addEventListener("change", function () {
      preview.innerHTML = "";
      message.textContent = "";

      const files = Array.from(this.files || []);

      if (files.length === 0) {
        message.textContent = "Rasm tanlanmadi.";
        return;
      }

      files.forEach(function (file) {
        if (!file.type.startsWith("image/")) return;

        const img = document.createElement("img");
        const imageUrl = URL.createObjectURL(file);

        img.src = imageUrl;
        img.alt = file.name;

        img.onload = function () {
          URL.revokeObjectURL(imageUrl);
        };

        preview.appendChild(img);
      });

      message.textContent =
        files.length + " ta fayl tanlandi.";
    });
  </script>
</body>
</html>
